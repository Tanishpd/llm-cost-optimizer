[project]
name = "llm-cost-optimizer"
# Single source of truth is app/__init__.py::__version__; check_docs.py
# asserts these agree.
version = "0.4.0"
description = "API gateway that routes each prompt to the cheapest model tier that can answer it"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this the suite only works when invoked as `python -m pytest` from the
# repo root, because that form alone puts the CWD on sys.path. Bare `pytest` —
# which is what CI and most editors run — could not import `app` at all.
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running Ollama and/or Redis (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
