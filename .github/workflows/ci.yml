name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what this project targets; 3.12 is the floor declared in
        # pyproject. Testing both catches syntax that only newer CPython allows.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Integration tests need a live Ollama with ~2.6 GB of models and are
      # deselected here on purpose. The unit suite runs with no network at all
      # — that constraint is what keeps it usable in CI.
      # Belt and braces with tests/test_dashboard.py, which skips if node is
      # missing. A skipped syntax check reads exactly like a passing one, and
      # this file is where a SyntaxError once blanked the whole page while 441
      # tests stayed green.
      - name: Dashboard JavaScript parses
        run: |
          python - <<'PY' > /tmp/dashboard.js
          import re, pathlib
          html = pathlib.Path("static/dashboard.html").read_text()
          print(re.findall(r"<script>(.*?)</script>", html, re.S)[0])
          PY
          node --check /tmp/dashboard.js

      - name: Unit tests
        run: pytest -m "not integration" -q

      - name: Assert no accidental network use
        # The unit suite must stay hermetic. If a test starts reaching out,
        # it will hang or fail here rather than becoming flaky later.
        run: pytest -m "not integration" -q -p no:cacheprovider
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9

  # Pinned dependencies are only safe if something checks them for known
  # vulnerabilities — a pin freezes a CVE in place just as well as it freezes a
  # working version.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pip-audit
      - name: Known vulnerabilities
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      - name: Ruff
        run: ruff check app eval scripts mock_frontier tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # check_docs.py imports app.config to compare settings against the docs,
      # so it needs the runtime dependencies — not just a bare checkout.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # This doc set has drifted twice in exactly these ways, so the checks
      # that caught it by hand now run automatically.
      - name: Cross-document consistency
        run: python scripts/check_docs.py

  # The dev machine has no Docker daemon, so this is the only place the image
  # is ever built. An unbuilt Dockerfile in a repo is a claim, not a deliverable.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t hlr-gateway:ci .

      - name: Boot with no dependencies at all
        # No Redis, no Ollama. The gateway must still start and report live —
        # that is invariant 4 (degrade, don't fail) at the process level. If it
        # crash-loops without its dependencies, this catches it here rather
        # than in someone's cluster.
        run: |
          docker run -d --name gw -p 8000:8000 hlr-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/livez; then ok=1; break; fi
            sleep 1
          done
          echo
          docker logs gw
          test "${ok:-0}" = 1 || { echo "gateway never became live"; exit 1; }

      - name: Readiness reports NOT ready without Ollama
        # The inverse check, and the more important one: /readyz must be honest.
        # A readiness probe that returns 200 with no models behind it would send
        # a broken instance live traffic.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/readyz)
          echo "/readyz -> $code"
          test "$code" = 503 || { echo "expected 503 with no Ollama, got $code"; exit 1; }

      - name: Image runs as non-root
        run: |
          uid=$(docker exec gw id -u)
          test "$uid" = 10001 || { echo "expected uid 10001, got $uid"; exit 1; }

      - name: Stop
        if: always()
        run: docker rm -f gw || true
