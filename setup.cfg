# mutmut 3.x reads its configuration from setup.cfg specifically, not from
# pyproject.toml where everything else lives. This file exists for that.
#
# Scoped to the PURE modules on purpose. Mutation testing asks "would a test
# fail if this line were wrong", and it answers that well for arithmetic,
# thresholds and string handling. Against I/O-heavy code it mostly produces
# mutants that no test could distinguish (a changed log message, a reordered
# await) and buries the real findings — the tool is only useful if its output
# is short enough to read.
[mutmut]
# The whole package is copied (the suite imports all of it); only these are
# mutated.
paths_to_mutate = app/
only_mutate =
    app/confidence.py
    app/costs.py
    app/cache/keys.py
    app/cache/guards.py
    app/shadow.py
    app/router/heuristics.py
    app/prometheus.py
    app/budgets.py
tests_dir = tests/
# Integration tests need a live Ollama and a running gateway; a mutant cannot
# be judged by a test that fails for want of a server.
pytest_add_cli_args_test_selection =
    -m
    not integration
# The suite imports these; mutmut copies only what it mutates.
also_copy =
    eval/
    pyproject.toml
    static/
    mock_frontier/
